# ============================================================
#  Noisy Data Handler — Central Configuration
# ============================================================

data:
  missing_threshold: 0.5        # Drop columns with >50% missing values
  duplicate_action: drop        # drop | flag
  low_variance_threshold: 0.01  # Drop near-zero variance features

imputation:
  numeric_strategy: knn         # mean | median | knn | iterative
  categorical_strategy: most_frequent  # most_frequent | constant
  knn_neighbors: 5
  iterative_max_iter: 10
  fill_value: "MISSING"         # used when categorical_strategy = constant

outlier_detection:
  method: isolation_forest      # iqr | zscore | isolation_forest | lof | none
  treatment: clip               # clip | remove | flag
  iqr_multiplier: 1.5
  zscore_threshold: 3.0
  contamination: 0.05           # for isolation_forest and lof
  lof_n_neighbors: 20

feature_engineering:
  scaling: robust               # standard | minmax | robust | none
  encode_categoricals: true
  encoding_strategy: onehot     # onehot | label | ordinal
  onehot_max_categories: 15     # use label encoding above this cardinality
  apply_log_transform: true     # for highly skewed numeric features
  skewness_threshold: 1.0
  polynomial_features: false
  polynomial_degree: 2
  interaction_features: false

model:
  task: classification          # classification | regression
  algorithm: random_forest      # random_forest | gradient_boosting | logistic_regression | linear_regression
  test_size: 0.2
  random_state: 42
  cv_folds: 5
  tune_hyperparameters: true

  hyperparameters:
    random_forest:
      n_estimators: [100, 200, 300]
      max_depth: [null, 5, 10, 20]
      min_samples_split: [2, 5, 10]
    gradient_boosting:
      n_estimators: [100, 200]
      learning_rate: [0.05, 0.1, 0.2]
      max_depth: [3, 5, 7]
    logistic_regression:
      C: [0.01, 0.1, 1, 10]
      solver: [lbfgs, liblinear]

reporting:
  generate_report: true
  output_dir: reports/
  plots: true
